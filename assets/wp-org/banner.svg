<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3338"/>
      <stop offset="1" stop-color="#14181b"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <circle cx="1400" cy="-40" r="260" fill="#e3f97a" opacity="0.06"/>
  <circle cx="80" cy="520" r="220" fill="#e3f97a" opacity="0.05"/>

  <text x="96" y="205" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="80" font-weight="700" fill="#ffffff">DrillNav</text>
  <text x="96" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#e3f97a">Smart contextual navigation</text>
  <text x="96" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" opacity="0.85">Shows only what matters on the current page —</text>
  <text x="96" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" opacity="0.85">perfect for deeply nested page hierarchies.</text>

  <!-- Hintere Ebene -->
  <g opacity="0.35">
    <rect x="940" y="96" width="400" height="330" rx="14" fill="#ffffff"/>
  </g>
  <!-- Mock-Navigation (gedrillte Ebene) -->
  <g filter="url(#sh)">
    <rect x="1010" y="62" width="430" height="376" rx="14" fill="#ffffff"/>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#1d2327">
    <text x="1036" y="108" font-weight="700" font-size="21" fill="#50575e" letter-spacing="1">SERVICES</text>
    <!-- Zurück -->
    <rect x="1036" y="126" width="378" height="46" rx="8" fill="#f0f0f1"/>
    <text x="1054" y="156" fill="#1d2327">←  Consulting</text>
    <!-- Einträge -->
    <text x="1054" y="214">Strategy</text>
    <text x="1396" y="214" text-anchor="end" font-size="36" fill="#50575e">›</text>
    <line x1="1036" y1="234" x2="1414" y2="234" stroke="#dcdcde" stroke-width="2"/>
    <rect x="1036" y="244" width="378" height="46" rx="8" fill="#e3f97a"/>
    <text x="1054" y="274" font-weight="700">Digital Transformation</text>
    <text x="1396" y="274" text-anchor="end" font-size="36">›</text>
    <line x1="1036" y1="300" x2="1414" y2="300" stroke="#dcdcde" stroke-width="2"/>
    <text x="1054" y="336">Change Management</text>
    <line x1="1036" y1="358" x2="1414" y2="358" stroke="#dcdcde" stroke-width="2"/>
    <text x="1054" y="394">Workshops</text>
    <text x="1396" y="394" text-anchor="end" font-size="36" fill="#50575e">›</text>
  </g>
</svg>
